name: Build VoiceKey

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: >
          pyinstaller --noconfirm --clean --windowed --name VoiceKey
          --collect-all faster_whisper --collect-all ctranslate2
          --collect-all onnxruntime --collect-all sounddevice --collect-data av
          voicekey.py
      - run: Compress-Archive -Path dist\VoiceKey -DestinationPath VoiceKey-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceKey-windows
          path: VoiceKey-windows.zip

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: PY=python BUILD_DIR=$HOME/.voicekey-build ./build_mac.sh
      - run: ditto -c -k --keepParent $HOME/.voicekey-build/dist/VoiceKey.app VoiceKey-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceKey-mac
          path: VoiceKey-mac.zip
